# SPDX-License-Identifier: MPL-2.0
[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecretary-memory"
version = "0.2.0a3"
description = "Vecretary Memory: local SQLite priority-memory MCP server and dashboard alpha"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.27,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
vecretary-mcp = "instinct.sqlite_service:cli"
vecretary-init = "instinct.sqlite_init:cli"
vecretary-sqlite = "instinct.sqlite_service:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["instinct", "instinct.*"]
namespaces = false

[tool.setuptools.package-data]
instinct = ["starter_memories.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default collection is the supported SQLite alpha suite; run legacy tests by explicit path.
python_files = [
    "test_sqlite*.py",
    "test_session_timer.py",
    "test_nudge_session.py",
    "test_active_time.py",
    "test_pop_scoring.py",
    "test_decay_bands.py",
    "test_mandatory_lifecycle.py",
    "test_dependency_license_collection.py",
    "test_public_draft.py",
    "test_release_policy.py",
    "test_runtime.py",
    "test_dashboard_security.py",
    "test_dashboard_features.py",
    "test_privacy_security_gates.py",
]
asyncio_mode = "auto"
