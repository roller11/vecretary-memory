# SPDX-License-Identifier: MPL-2.0
[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecretary-memory"
version = "0.2.0a2"
description = "Vecretary Memory: local SQLite priority-memory MCP server and dashboard alpha"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.27,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
vecretary-mcp = "instinct.sqlite_service:cli"
vecretary-init = "instinct.sqlite_init:cli"
vecretary-sqlite = "instinct.sqlite_service:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["instinct", "instinct.*"]
namespaces = false

[tool.setuptools.package-data]
instinct = ["starter_memories.json", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
